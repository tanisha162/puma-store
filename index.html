<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>PUMA Apparel Store</title>


<style>

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    width:100%;
    overflow-x:hidden;
}

body{
    min-height:100vh;
    width:100%;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    background:#e9e9eb;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:30px;

    overflow-x:hidden;
}


/* =========================================================
   MAIN STORE
========================================================= */

.store{

    width:min(1450px,96vw);

    min-height:820px;

    display:grid;

    grid-template-columns:
        57% 43%;

    background:white;

    border-radius:38px;

    overflow:hidden;

    box-shadow:
        0 30px 70px rgba(0,0,0,.16);

    position:relative;
}


/* =========================================================
   LEFT HERO
========================================================= */

.hero{

    position:relative;

    min-height:820px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 82% 8%,
            rgba(255,255,255,.30),
            transparent 20%
        ),
        linear-gradient(
            135deg,
            #d93ea9,
            #ed75c5 50%,
            #aa76e5
        );

    color:white;

    transition:
        background .7s ease,
        color .5s ease;
}


/* =========================================================
   DECORATIVE CIRCLES
========================================================= */

.hero::before{

    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
        rgba(255,255,255,.10);

    top:-150px;
    right:-130px;
}

.hero::after{

    content:"";

    position:absolute;

    width:360px;
    height:360px;

    border-radius:50%;

    background:
        rgba(130,80,255,.15);

    bottom:-180px;
    left:-100px;
}


/* =========================================================
   PUMA LOGO + DESCRIPTION
========================================================= */

.brand-row{

    display:flex;

    align-items:flex-start;

    gap:28px;

    margin-bottom:45px;

    padding-top:20px;

    margin-left:20px;

    position:relative;

    z-index:30;
}

.puma-logo{

    color:#fff;

    font-size:24px;

    font-weight:900;

    line-height:1;

    white-space:nowrap;
}

.puma-logo sup{

    font-size:9px;

    vertical-align:top;

    margin-left:2px;
}

.brand-description{

    color:#fff;

    font-size:14px;

    line-height:1.35;

    font-weight:500;

    max-width:145px;

    padding-top:0;

    display:block;
}


/* =========================================================
   HERO CONTENT
========================================================= */

.hero-content{

    position:absolute;

    left:52px;

    top:145px;

    width:290px;

    z-index:15;
}

.collection{

    font-size:16px;

    font-weight:700;

    letter-spacing:1px;

    margin-bottom:18px;

    text-transform:uppercase;
}


/* =========================================================
   TITLE
========================================================= */

.hero-title{

    font-size:
        clamp(50px,5vw,80px);

    line-height:.84;

    font-weight:900;

    letter-spacing:-5px;

    max-width:300px;

    margin-bottom:28px;

    word-break:normal;

    transition:
        opacity .3s ease,
        transform .3s ease;
}


/* =========================================================
   WHITE COLLECTION
========================================================= */

.hero.white{

    background:
        radial-gradient(
            circle at 82% 8%,
            rgba(255,255,255,.75),
            transparent 22%
        ),
        linear-gradient(
            135deg,
            #dff7e8,
            #c8f0d8 55%,
            #aee6c3
        );

    color:#374151;
}

.hero.white .hero-title{
    color:#374151;
}

.hero.white .collection{
    color:#374151;
}

.hero.white .description{
    color:#374151;
}

.hero.white .brand-description{
    color:#374151;
}

.hero.white .puma-logo{
    color:#374151;
}


/* =========================================================
   DESCRIPTION
========================================================= */

.description{

    font-size:19px;

    line-height:1.45;

    width:230px;

    margin-bottom:25px;

    font-weight:500;
}


/* =========================================================
   PRODUCT IMAGE
========================================================= */

.product-image-wrapper{

    position:absolute;

    right:15px;

    top:122px;

    width:59%;

    height:560px;

    display:flex;

    align-items:center;

    justify-content:center;

    z-index:5;

    pointer-events:none;
}

.product-image{

    width:100%;

    height:100%;

    object-fit:contain;

    object-position:center;

    filter:
        drop-shadow(
            0 25px 20px rgba(0,0,0,.22)
        );

    transition:
        opacity .45s ease,
        transform .55s ease;

    animation:
        productFloat 5s ease-in-out infinite;
}

@keyframes productFloat{

    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}


/* =========================================================
   FLOATING BLOBS
========================================================= */

.blob{

    position:absolute;

    border-radius:50%;

    z-index:3;

    pointer-events:none;

    animation:
        blobFloat 5s ease-in-out infinite;
}

.blob-one{

    width:72px;
    height:72px;

    top:45px;
    right:110px;

    background:
        radial-gradient(
            circle at 30% 25%,
            #fff,
            #ff9bd3 25%,
            #ef5cae 75%
        );

    box-shadow:
        0 15px 35px
        rgba(255,100,180,.35);
}

.blob-two{

    width:90px;
    height:55px;

    bottom:205px;
    left:305px;

    border-radius:
        50% 40% 60% 40%;

    background:
        linear-gradient(
            135deg,
            #b878ff,
            #7040db
        );

    transform:rotate(25deg);

    filter:blur(1px);
}

.blob-three{

    width:85px;
    height:70px;

    bottom:110px;
    right:15px;

    border-radius:
        60% 30% 50% 30%;

    background:
        linear-gradient(
            135deg,
            #ff94cb,
            #ff4e9b
        );

    transform:rotate(-20deg);
}

@keyframes blobFloat{

    0%,100%{
        transform:
            translateY(0)
            rotate(0deg);
    }

    50%{
        transform:
            translateY(-18px)
            rotate(8deg);
    }
}


/* =========================================================
   CHARACTER ANIMATION
========================================================= */

.boy-animation{

    position:absolute;

    left:-220px;

    bottom:48px;

    width:160px;

    height:auto;

    max-height:430px;

    object-fit:contain;

    object-position:center bottom;

    z-index:10;

    pointer-events:none;

    animation:
        boyImageEntrance
        10s
        ease-in-out
        infinite;
}

@keyframes boyImageEntrance{

    0%,6%{

        left:-220px;

        opacity:0;

        transform:
            translateY(10px)
            scale(.96);
    }

    14%{

        left:20px;

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

    52%{

        left:20px;

        opacity:1;

        transform:
            translateY(-4px)
            scale(1);
    }

    62%{

        left:20px;

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }

    76%,100%{

        left:-220px;

        opacity:0;

        transform:
            translateY(10px)
            scale(.96);
    }
}


/* =========================================================
   CATEGORY BAR
========================================================= */

.categories{

    position:absolute;

    left:38px;
    right:38px;

    bottom:40px;

    height:105px;

    border-radius:30px;

    border:
        1px solid rgba(255,255,255,.6);

    background:
        rgba(255,255,255,.14);

    backdrop-filter:
        blur(18px);

    display:grid;

    grid-template-columns:
        repeat(5,1fr);

    align-items:center;

    z-index:25;

    padding:10px;
}

.category{

    height:85px;

    display:flex;

    flex-direction:column;

    justify-content:center;

    align-items:center;

    gap:7px;

    color:
        rgba(255,255,255,.9);

    font-size:14px;

    border-radius:25px;

    cursor:pointer;

    transition:.3s;
}

.category:hover{

    background:
        rgba(255,255,255,.14);

    transform:
        translateY(-3px);
}

.category.active{

    background:white;

    color:#ed2e8a;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.12);
}

.category-icon{

    font-size:26px;
}


/* =========================================================
   RIGHT STORE PANEL
========================================================= */

.store-panel{

    background:#fff;

    padding:
        55px 45px 35px;

    position:relative;

    display:flex;

    flex-direction:column;
}


/* =========================================================
   STORE HEADING
========================================================= */

.store-heading h1{

    font-size:43px;

    line-height:1.05;

    color:#111;

    letter-spacing:-2px;
}

.store-heading p{

    color:#8d8d8d;

    margin-top:12px;

    font-size:17px;
}


/* =========================================================
   SHOPPING BAG
========================================================= */

.bag{

    position:absolute;

    top:48px;
    right:40px;

    width:62px;
    height:62px;

    border-radius:18px;

    background:white;

    display:flex;

    justify-content:center;

    align-items:center;

    box-shadow:
        0 10px 30px
        rgba(0,0,0,.08);

    font-size:25px;
}


/* =========================================================
   TABLE HEAD
========================================================= */

.table-head{

    display:grid;

    grid-template-columns:
        1fr 75px 80px 55px;

    gap:10px;

    margin-top:40px;

    padding:
        0 12px 12px;

    color:#777;

    font-size:12px;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =========================================================
   PRODUCTS
========================================================= */

.products{

    display:flex;

    flex-direction:column;

    gap:9px;
}

.product-row{

    min-height:125px;

    border:
        1px solid #e6e6e6;

    border-radius:20px;

    display:grid;

    grid-template-columns:
        1fr 65px 80px 55px;

    gap:10px;

    align-items:center;

    padding:12px;

    box-shadow:
        0 5px 15px
        rgba(0,0,0,.025);

    transition:
        transform .25s ease,
        box-shadow .25s ease;
}

.product-row:hover{

    transform:
        translateY(-3px);

    box-shadow:
        0 12px 25px
        rgba(0,0,0,.08);
}


/* =========================================================
   PRODUCT INFO
========================================================= */

.product-info{

    display:flex;

    align-items:center;

    gap:18px;

    min-width:0;
}

.thumb{

    width:88px;

    height:95px;

    object-fit:cover;

    border-radius:16px;

    background:#f1f1f1;

    flex-shrink:0;
}

.product-name{

    font-size:17px;

    font-weight:800;

    line-height:1.15;

    color:#151515;
}

.product-color{

    color:#888;

    font-size:14px;

    margin-top:9px;
}


/* =========================================================
   SIZE
========================================================= */

.size{

    width:42px;
    height:42px;

    border-radius:50%;

    background:#f8edf7;

    color:#9a4f96;

    display:flex;

    justify-content:center;

    align-items:center;

    font-weight:700;
}


/* =========================================================
   PRICE
========================================================= */

.price{

    color:#ef2e88;

    font-weight:800;

    font-size:16px;
}


/* =========================================================
   ADD BUTTON
========================================================= */

.add{

    width:44px;
    height:44px;

    border:none;

    border-radius:50%;

    background:#f52e8b;

    color:white;

    font-size:28px;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:center;

    transition:.25s;

    box-shadow:
        0 7px 18px
        rgba(245,46,139,.25);
}

.add:hover{

    transform:scale(1.12);

    background:#d91f75;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{

    margin-top:auto;

    height:85px;

    border:
        1px solid #e5e5e5;

    border-radius:45px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:
        10px 12px 10px 30px;

    box-shadow:
        0 8px 25px
        rgba(0,0,0,.05);

    gap:10px;
}

.counter{

    font-size:18px;

    font-weight:700;

    color:#252525;

    white-space:nowrap;
}

.dots{

    display:flex;

    gap:10px;

    margin-left:20px;

    margin-right:auto;
}

.dot{

    width:8px;
    height:8px;

    background:#d5d5d5;

    border-radius:50%;
}

.dot.active{

    background:#f52e8b;
}


/* =========================================================
   NEXT BUTTON
========================================================= */

.next-btn{

    height:62px;

    min-width:245px;

    padding:
        0 8px 0 25px;

    border:none;

    border-radius:40px;

    background:
        linear-gradient(
            90deg,
            #fa3d94,
            #f32c87
        );

    color:white;

    font-size:15px;

    font-weight:800;

    cursor:pointer;

    display:flex;

    align-items:center;

    justify-content:space-between;

    gap:15px;

    box-shadow:
        0 12px 30px
        rgba(245,46,139,.25);

    transition:.25s;
}

.next-btn:hover{

    transform:scale(1.03);
}

.next-arrow{

    width:47px;
    height:47px;

    border-radius:50%;

    background:white;

    color:#f52e8b;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:23px;
}


/* =========================================================
   COLLECTION CHANGE ANIMATION
========================================================= */

.change-out{

    opacity:0 !important;

    transform:
        translateY(15px)
        scale(.97) !important;
}

.change-in{

    animation:
        changeIn .6s ease forwards;
}

@keyframes changeIn{

    from{

        opacity:0;

        transform:
            translateY(15px)
            scale(.97);
    }

    to{

        opacity:1;

        transform:
            translateY(0)
            scale(1);
    }
}


/* =========================================================
   TABLET
========================================================= */

@media(max-width:1100px){

    body{

        padding:15px;

        align-items:flex-start;
    }

    .store{

        grid-template-columns:1fr;

        width:95vw;

        max-width:800px;

        min-height:auto;
    }

    .hero{

        min-height:720px;
    }

    .store-panel{

        min-height:700px;
    }
}


/* =========================================================
   MOBILE RESPONSIVE
========================================================= */

@media(max-width:650px){

    html,
    body{

        width:100%;

        max-width:100%;

        overflow-x:hidden;
    }

    body{

        padding:0;

        display:block;

        background:#fff;
    }


    /* =====================================================
       STORE
    ===================================================== */

    .store{

        width:100%;

        max-width:none;

        min-height:100vh;

        display:block;

        border-radius:0;

        overflow:hidden;

        box-shadow:none;
    }


    /* =====================================================
       MOBILE HERO
    ===================================================== */

    .hero{

        position:relative;

        width:100%;

        height:720px;

        min-height:720px;

        overflow:hidden;
    }


    /* =====================================================

    ===================================================== */

    .brand-row{

        position:absolute;

        top:0;
        left:0;

        width:100%;

        margin:0;

        padding:
            20px 20px 0;

        display:flex;

        align-items:flex-start;

        gap:14px;

        z-index:50;
    }

    .puma-logo{

        font-size:22px;

        line-height:1;

        flex-shrink:0;
    }

    .puma-logo sup{

        font-size:8px;
    }

    .brand-description{

        display:block;

        font-size:11px;

        line-height:1.25;

        max-width:125px;

        padding-top:1px;
    }


    /* =====================================================
       MOBILE HERO CONTENT
    ===================================================== */

    .hero-content{

        position:absolute;

        top:145px;

        left:25px;

        width:
            calc(100% - 50px);

        z-index:25;
    }

    .collection{

        font-size:15px;

        letter-spacing:.7px;

        margin-bottom:18px;
    }

    .hero-title{

        font-size:60px;

        line-height:.86;

        letter-spacing:-4px;

        max-width:210px;

        margin-bottom:25px;
    }

    .description{

        width:190px;

        font-size:16px;

        line-height:1.4;

        margin:0;

        position:relative;

        z-index:40;
    }


    /* =====================================================
       MOBILE PRODUCT IMAGE
    ===================================================== */

    .product-image-wrapper{

        position:absolute;

        top:365px;

        right:-5px;

        width:48%;

        height:300px;

        display:flex;

        align-items:center;

        justify-content:center;

        z-index:8;

        pointer-events:none;
    }

    .product-image{

        width:100%;

        height:100%;

        object-fit:contain;

        object-position:center;

        filter:
            drop-shadow(
                0 18px 16px
                rgba(0,0,0,.20)
            );
    }


    /* =====================================================
       MOBILE CHARACTER
    ===================================================== */

    .boy-animation{

        position:absolute;

        width:105px;

        max-width:105px;

        height:auto;

        max-height:250px;

        left:5px;

        bottom:88px;

        object-fit:contain;

        object-position:center bottom;

        z-index:18;

        pointer-events:none;

        animation:
            boyImageEntrance
            10s
            ease-in-out
            infinite;
    }


    @keyframes boyImageEntrance{

        0%,6%{

            left:-130px;

            opacity:0;

            transform:
                translateY(10px)
                scale(.96);
        }

        14%{

            left:5px;

            opacity:1;

            transform:
                translateY(0)
                scale(1);
        }

        52%{

            left:5px;

            opacity:1;

            transform:
                translateY(-4px)
                scale(1);
        }

        62%{

            left:5px;

            opacity:1;

            transform:
                translateY(0)
                scale(1);
        }

        76%,100%{

            left:-130px;

            opacity:0;

            transform:
                translateY(10px)
                scale(.96);
        }
    }


    /* =====================================================
       MOBILE CATEGORY BAR
    ===================================================== */

    .categories{

        position:absolute;

        left:12px;

        right:12px;

        bottom:15px;

        width:auto;

        height:82px;

        z-index:45;

        grid-template-columns:

    }

    .category{

        border-radius:20px;

        gap:4px;

        font-size:10px;

        white-space:nowrap;
    }

    .category-icon{

        font-size:19px;
    }


    /* =====================================================
       MOBILE STORE PANEL
    ===================================================== */

    .store-panel{

        width:100%;

        min-height:auto;

        padding:
            35px 20px 30px;

        display:flex;
    }

    .store-heading{

        padding-right:55px;
    }

    .store-heading h1{

        font-size:34px;

        line-height:1.05;

        letter-spacing:-1.5px;
    }

    .store-heading p{

        font-size:15px;

        margin-top:10px;
    }


    /* =====================================================
       MOBILE SHOPPING BAG
    ===================================================== */

    .bag{

        top:30px;

        right:20px;

        width:50px;

        height:50px;

    }


    /* =====================================================
       HIDE TABLE HEADER
    ===================================================== */

    .table-head{

    }


    /* =====================================================

    ===================================================== */

    .products{

    .product-row{

    }

    .product-info{

        min-width:0;

        gap:8px;
    }

        width:58px;

        height:68px;

        border-radius:13px;
    }

    .product-info > div:last-child{

        min-width:0;
    }

    .product-name{

        font-size:12px;

        line-height:1.15;
    }

    .product-color{

        font-size:10px;

        margin-top:5px;
    }

    .size{

        width:34px;

        height:34px;

        font-size:12px;
    }

        white-space:nowrap;
    }

        font-size:20px;
    }


    /* =====================================================
       MOBILE CONTROLS
    ===================================================== */

    .controls{

        width:100%;

        height:72px;

        margin-top:25px;

        padding:
            7px 7px 7px 15px;

        border-radius:36px;

        gap:5px;
    }

    .counter{

        font-size:13px;
    }

    .dots{

        gap:5px;

        margin-left:5px;

        margin-right:auto;
    }

    .dot{

        width:6px;

        height:6px;
    }

    .next-btn{

        min-width:135px;

        height:56px;

        padding:
            0 6px 0 15px;

        font-size:11px;

        gap:5px;
    }

    .next-arrow{

        width:42px;

        height:42px;

        font-size:19px;
    }
}


/* =========================================================
   SMALL MOBILE - 390PX
========================================================= */

@media(max-width:390px){

    .hero{

        height:700px;

        min-height:700px;
    }

    .brand-row{

        padding-left:15px;

        padding-right:15px;
    }

    .hero-content{

        left:20px;

        width:
            calc(100% - 40px);

        top:140px;
    }

    .hero-title{

        font-size:55px;

        max-width:190px;
    }

    .description{

        width:170px;

        font-size:15px;
    }

    .product-image-wrapper{

/* =========================================================

========================================================= */

let currentIndex = 0;

const hero =
    document.getElementById("hero");

const heroImage =
    document.getElementById("heroImage");

const heroTitle =
    document.getElementById("heroTitle");

const heroDescription =
    document.getElementById(
        "heroDescription"
    );

const products =
    document.getElementById(
        "products"
    );

const counter =
    document.getElementById(
        "counter"
    );

const dots =
    document.querySelectorAll(
        ".dot"
    );

const nextButton =
    document.getElementById(
        "nextButton"
    );


/* =========================================================
   RENDER PRODUCTS
========================================================= */

function renderProducts(collection){

    products.classList.add(
        "change-out"
    );


    setTimeout(() => {

        products.innerHTML = "";


        collection.products.forEach(
            product => {

                const row =
                    document.createElement(
                        "div"
                    );


                row.className =
                    "product-row change-in";


                row.innerHTML = `

                    <div class="product-info">

                        <img
                            class="thumb"
                            src="${product.image}"
                            alt="${product.color}"
                        >

                        <div>

                            <div
                                class="product-name"
                            >
                                ${product.name}
                            </div>

                            <div
                                class="product-color"
                            >
                                ${product.color}
                            </div>

                        </div>

                    </div>


                    <div class="size">
                        ${product.size}
                    </div>


                    <div class="price">
                        ${product.price}
                    </div>


                    <button
                        class="add"
                        type="button"
                    >
                        +
                    </button>

                `;


                products.appendChild(row);

            }
        );


        products.classList.remove(
            "change-out"
        );

    },250);

}


/* =========================================================
   CHANGE COLLECTION
========================================================= */

function changeCollection(){

    currentIndex++;


    if(
        currentIndex >=
        collections.length
    ){

        currentIndex = 0;

    }


    const collection =
        collections[currentIndex];


    /* HERO BACKGROUND */

    hero.style.background =
        collection.background;


    /* WHITE CLASS */

    if(collection.white){

        hero.classList.add(
            "white"
        );

    }
    else{

        hero.classList.remove(
            "white"
        );

    }


    /* TEXT ANIMATION */

    heroTitle.classList.add(
        "change-out"
    );

    heroDescription.classList.add(
        "change-out"
    );


    setTimeout(() => {

        heroTitle.innerHTML =
            collection.title;

        heroDescription.innerHTML =
            collection.description;


        heroTitle.classList.remove(
            "change-out"
        );

        heroDescription.classList.remove(
            "change-out"
        );


        heroTitle.classList.add(
            "change-in"
        );

        heroDescription.classList.add(
            "change-in"
        );


        setTimeout(() => {

            heroTitle.classList.remove(
                "change-in"
            );

            heroDescription.classList.remove(
                "change-in"
            );

        },600);

    },250);


    /* PRODUCT IMAGE */

    heroImage.style.opacity =
        "0";

    heroImage.style.transform =
        "translateY(20px) scale(.96)";


    setTimeout(() => {

        heroImage.src =
            collection.image;

        heroImage.style.opacity =
            "1";

        heroImage.style.transform =
            "translateY(0) scale(1)";

    },300);


    /* PRODUCTS */

    renderProducts(
        collection
    );


    /* COUNTER */

    counter.textContent =
        `0${currentIndex + 1} / 04`;


    /* DOTS */

    dots.forEach(
        (dot,index) => {

            dot.classList.toggle(
                "active",
                index === currentIndex
            );

        }
    );

}


/* =========================================================
   NEXT BUTTON
========================================================= */

nextButton.addEventListener(
    "click",
    changeCollection
);

            changeCollection();

);


/* =========================================================

========================================================= */

document
.querySelectorAll(".category")
.forEach(category => {

        "click",
        () => {

            document
            .querySelectorAll(
                ".category"
            )
            .forEach(item => {

                item.classList.remove(
                    "active"
                );

            });


            category.classList.add(
                "active"
            );

        }
    );

});

========================================================= */

            setTimeout(() => {
